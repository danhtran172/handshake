# XcodeGen spec: `xcodegen generate` turns this into Handshake.xcodeproj (built on a macOS CI runner).
# Two targets: the app (iPhone as a second screen for the PC) and the ReplayKit broadcast upload
# extension (iPhone screen to the PC). No App Groups or other paid-only capabilities, so a free
# Apple ID can sign it with Sideloadly.
name: Handshake
options:
  bundleIdPrefix: app.handshake
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Handshake:
    type: application
    platform: iOS
    sources:
      - Handshake
      - Shared
    dependencies:
      - target: HandshakeBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.handshake.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Handshake/Info.plist
      properties:
        CFBundleDisplayName: Handshake
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets CoreAnimation run at 120 Hz on ProMotion iPhones
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: Handshake tìm và kết nối tới máy tính của bạn trong mạng nội bộ hoặc qua cáp.
        NSBonjourServices:
          - _handshake._tcp
          - _hs-mirror._tcp
  HandshakeBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - HandshakeBroadcast
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.handshake.ios.broadcast
    info:
      path: HandshakeBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Handshake
        NSLocalNetworkUsageDescription: Handshake gửi màn hình iPhone tới máy tính của bạn.
        NSBonjourServices:
          - _hs-mirror._tcp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
